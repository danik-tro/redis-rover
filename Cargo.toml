[package]
name = "redis-rover"
version = "0.1.0"
edition = "2021"
authors = ["Daniil Trotsenko <daniil.trotsenko.dev@gmail.com>"]
readme = "README.md"
keywords = ["redis", "tui", "cli", "terminal"]
categories = ["command-line-utilities"]
documentation = "https://docs.rs/redis-rover"
homepage = "https://github.com/danik-tro/redis-rover"
repository = "https://github.com/danik-tro/redis-rover"
license = "MIT"
description = "A Redis terminal-ui client written in rust 🦀"
rust-version = "1.78"

build = "build.rs"

[dependencies]
better-panic = "0.3.0"
clap = { version = "4.6.1", features = ["derive", "cargo", "wrap_help", "unicode", "string", "unstable-styles"] }
color-eyre = "0.6.5"
config = "0.15.23"
crossterm = { version = "0.28.1", features = ["serde", "event-stream"] }
derive_deref = "1.1.1"
directories = "6.0.0"
futures = "0.3.32"
human-panic = "2.0.8"
json5 = "1.3.1"
lazy_static = "1.5.0"
libc = "0.2.186"
log = "0.4.29"
pretty_assertions = "1.4.1"
ratatui = { version = "0.28.1", features = ["serde", "macros"] }
serde = { version = "1.0.196", features = ["derive"] }
serde_json = "1.0.150"
serde_with = "3.20.0"
signal-hook = "0.4.4"
strip-ansi-escapes = "0.2.1"
strum = { version = "0.28.0", features = ["derive"] }
itertools = "0.13.0"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"
tracing = "0.1.40"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "serde"] }

redis = { version = "1.2.1", default-features = false, features = ["aio", "tokio-comp", "connection-manager"]}
byte-unit = { version = "5.2.0", features = ["serde", "byte"], default-features = false}
tui-input = "0.10.1"
tui-textarea = "0.6.1"
rpassword = "7.5.2"

[build-dependencies]
vergen = { version = "8.3.1", features = [ "build", "git", "gitoxide", "cargo" ]}

[[bin]]
bench = false
path = "src/main.rs"
name = "rrover"
