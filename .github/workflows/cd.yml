name: CD # Continuous Deployment

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"
  # Manual dry run: builds and uploads the archives as workflow artifacts,
  # without creating a release or publishing to crates.io.
  workflow_dispatch:

permissions:
  contents: write

env:
  # Keep in sync with rust-toolchain.toml.
  RUST_TOOLCHAIN: "1.97"
  BINARY_NAME: rrover

jobs:
  publish:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os-name: macos
            target: x86_64-apple-darwin
            architecture: x86_64
            binary-postfix: ""
            use-cross: false
          - os: macos-latest
            os-name: macos
            target: aarch64-apple-darwin
            architecture: arm64
            binary-postfix: ""
            use-cross: false
          - os: ubuntu-latest
            os-name: linux
            target: x86_64-unknown-linux-gnu
            architecture: x86_64
            binary-postfix: ""
            use-cross: false
          - os: windows-latest
            os-name: windows
            target: x86_64-pc-windows-msvc
            architecture: x86_64
            binary-postfix: ".exe"
            use-cross: false
          - os: ubuntu-latest
            os-name: linux
            target: aarch64-unknown-linux-gnu
            architecture: arm64
            binary-postfix: ""
            use-cross: true
          - os: ubuntu-latest
            os-name: linux
            target: i686-unknown-linux-gnu
            architecture: i686
            binary-postfix: ""
            use-cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # vergen reads `git describe` for the version string.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.use-cross }}" == "true" ]]; then
            BUILD=cross
          else
            BUILD=cargo
          fi
          "$BUILD" build --release --locked --target ${{ matrix.target }}

      # Debug symbols are stripped by `[profile.release] strip = true`.
      - name: Package
        id: package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release

          BIN="${BINARY_NAME}${{ matrix.binary-postfix }}"
          VERSION="${GITHUB_REF_NAME//\//-}"
          RELEASE_NAME="${BINARY_NAME}-${VERSION}-${{ matrix.os-name }}-${{ matrix.architecture }}"

          tar czvf "$RELEASE_NAME.tar.gz" "$BIN"

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            certutil -hashfile "$RELEASE_NAME.tar.gz" sha256 | grep -E '[A-Fa-f0-9]{64}' > "$RELEASE_NAME.sha256"
          else
            shasum -a 256 "$RELEASE_NAME.tar.gz" > "$RELEASE_NAME.sha256"
          fi

          echo "name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}-*.tar.gz
            target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}-*.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}-*.tar.gz
            target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}-*.sha256

  publish-cargo:
    name: Publish to crates.io
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
