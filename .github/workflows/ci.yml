name: CI

on:
  # PR commits run via pull_request; master runs only after a merge. This way
  # no commit runs twice (once for the push, once for the PR).
  push:
    branches: [master]
  pull_request:
  # Every 5 days, so the integration suite also catches changes in the Redis image.
  schedule:
    - cron: "0 3 */5 * *"

# A newer commit on the same PR / branch cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  machete:
    name: Machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked

  fmt:
    name: Fmt
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.97.1

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt

      - name: Run cargo fmt
        run: cargo +${{ matrix.rust }} fmt --all -- --check

  clippy:
    needs: [fmt]
    name: Clippy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.97.1

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy

      - name: Run cargo clippy
        run: cargo +${{ matrix.rust }} clippy --all-targets --all-features -- -D warnings -W clippy::all -W clippy::pedantic

  build:
    needs: [fmt, clippy]
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.97.1

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Run cargo build
        run: cargo +${{ matrix.rust }} build --all-features

  test:
    needs: [build]
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.97.1

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Nextest
        run: cargo +${{ matrix.rust }} nextest run --workspace --all-targets

  integration:
    needs: [build]
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@v2

      # Pull up front so a slow registry shows up here, not as a test timeout.
      - name: Pull Redis image
        run: docker pull redis:7-alpine

      # Real Redis in Docker via testcontainers; every test is #[ignore]d so
      # the regular Tests job stays Docker-free.
      - name: Integration tests
        run: cargo +1.97.1 test --locked --test integration -- --ignored --test-threads=1
