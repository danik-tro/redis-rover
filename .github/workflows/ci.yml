name: CI

on:
  push:
    branches: "*"
    tags:
      - "v*"
  pull_request:
    branches: "*"
  # Nightly, so the integration suite also catches changes in the Redis image.
  schedule:
    - cron: "0 3 */5 * *"

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    # TODO: remove continue-on-error once known advisories are triaged
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  deny:
    name: Deny
    runs-on: ubuntu-latest
    # TODO: remove continue-on-error once deny.toml license allowlist is complete
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  machete:
    name: Machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked

  fmt:
    name: Fmt
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.97.1

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt

      - name: Run cargo fmt
        run: cargo +${{ matrix.rust }} fmt --all -- --check

  clippy:
    needs: [fmt]
    name: Clippy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.97.1

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy

      - name: Run cargo clippy
        run: cargo +${{ matrix.rust }} clippy --all-targets --all-features -- -D warnings -W clippy::all -W clippy::pedantic

  build:
    needs: [fmt, clippy]
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.97.1

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Run cargo build
        run: cargo +${{ matrix.rust }} build --all-features

  test:
    needs: [build]
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.97.1

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Nextest
        run: cargo +${{ matrix.rust }} nextest run --workspace --all-targets

  integration:
    needs: [build]
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@v2

      # Pull up front so a slow registry shows up here, not as a test timeout.
      - name: Pull Redis image
        run: docker pull redis:7-alpine

      # Real Redis in Docker via testcontainers; every test is #[ignore]d so
      # the regular Tests job stays Docker-free.
      - name: Integration tests
        run: cargo +1.97.1 test --locked --test integration -- --ignored --test-threads=1
